server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve files directly; fall back to index.html (SPA-style routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Light caching for static assets.
    location ~* \.(?:css|js|svg|png|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
